[project]
name = "mcp-cloudflare"
version = "0.1.0"
description = "Cloudflare operations as Python library, LangChain tools, and MCP server"
authors = [{name = "Landry Zetam"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["httpx>=0.27.0", "pydantic-settings>=2.0"]

[project.optional-dependencies]
mcp = ["fastmcp>=2.0.0"]
langchain = ["langchain-core>=0.2.0", "pydantic>=2.0.0"]
all = ["fastmcp>=2.0.0", "langchain-core>=0.2.0", "pydantic>=2.0.0"]
dev = [
    "pytest>=8.0",
    "respx>=0.21.0",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/lyzetam/mcp-cloudflare"
Repository = "https://github.com/lyzetam/mcp-cloudflare"

[project.scripts]
mcp-cloudflare = "mcp_cloudflare.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_cloudflare"]

[tool.pytest.ini_options]
testpaths = ["tests"]
